openapi: 3.0.3
info:
  title: Delicia Gelada - FYNIX
  description: API destinada para controlar a documentação da Delicia Gelada
  termsOfService: http://swagger.io/terms/
  version: 1.0.4.26
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: /
paths:
  # ==========================================
  # CARGO
  # ==========================================
  /v1/fynix/deliciagelada/cargo:
    post:
      tags:
        - cargo
      summary: Adiciona um novo Cargo
      description: Adiciona um novo Cargo no Banco de Dados
      requestBody:
        description: JSON contendo os dados do novo Cargo a ser inserido no sistema
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cargo'
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '500':
          description: Error Model
    get:
      tags:
        - cargo
      summary: Lista todos os cargos
      description: Listagem de todos os cargos registados no sistema
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cargo'
        '404':
          description: Not Found
  /v1/fynix/deliciagelada/cargo/{id}:
    get:
      tags:
        - cargo
      summary: Busca um cargo pelo ID
      description: Retorna um cargo pelo ID
      parameters:
        - name: id
          in: path
          description: ID para retornar o cargo
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '400':
          description: Invalid ID supplied
        '404':
          description: Cargo not found
    put:
      tags:
        - cargo
      summary: Atualizar um cargo existente pelo ID
      description: Localizar e atualizar um cargo buscando pelo ID
      parameters:
        - name: id
          in: path
          description: ID para localizar e atualizar o cargo
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar o cargo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cargo'
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Cargo not found
    delete:
      tags:
        - cargo
      summary: Excluir um cargo pelo Id
      description: Localizar e excluir um cargo pelo ID
      parameters:
        - name: id
          in: path
          description: ID para localizar o cargo
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Cargo not found

